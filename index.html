<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수업 신청 시스템</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=DM+Serif+Display&display=swap');
  :root {
    --bg: #0f0f14; --surface: #1a1a24; --surface2: #22222f; --border: #2e2e40;
    --accent: #7c6af7; --accent2: #f7a26a; --accent3: #6af7c8;
    --text: #e8e8f0; --text2: #8888a8; --danger: #f76a6a; --success: #6af7a2;
    --warning: #f7d96a; --desk-color: #6ab4f7; --easel-color: #f7a26a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 16px 24px; display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .logo { font-family: 'DM Serif Display', serif; font-size: 22px; color: var(--accent); letter-spacing: 1px; }
  .logo span { color: var(--accent2); }
  .tab-btns { display: flex; gap: 8px; }
  .tab-btn {
    padding: 8px 20px; border-radius: 20px; border: 1px solid var(--border);
    background: transparent; color: var(--text2); cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif; font-size: 14px; transition: all 0.2s;
  }
  .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  main { max-width: 960px; margin: 0 auto; padding: 32px 20px; }

  .week-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .week-nav h2 { font-size: 18px; font-weight: 500; }
  .nav-btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center; transition: all 0.2s;
  }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent); }

  .legend {
    display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap;
    background: var(--surface); border-radius: 10px; padding: 12px 16px;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

  .schedule-grid {
    display: grid; grid-template-columns: 80px repeat(7, 1fr); gap: 5px; margin-bottom: 32px;
  }
  .grid-header { text-align: center; padding: 10px 4px; font-size: 12px; color: var(--text2); font-weight: 500; }
  .grid-header.today { color: var(--accent); font-weight: 700; }
  .time-label {
    display: flex; flex-direction: column; justify-content: center;
    align-items: flex-end; padding-right: 10px; font-size: 10px; color: var(--text2); line-height: 1.5;
  }
  .class-cell {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 6px; cursor: pointer; transition: all 0.2s; text-align: center;
  }
  .class-cell:hover:not(.closed) {
    border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 20px rgba(124,106,247,0.2);
  }
  .class-cell.closed { background: var(--bg); border-color: var(--border); cursor: not-allowed; opacity: 0.45; }
  .cell-closed-label { font-size: 11px; color: var(--text2); font-weight: 500; padding: 8px 0; }
  .seat-row { display: flex; gap: 4px; justify-content: center; margin-top: 4px; }
  .seat-badge { flex: 1; border-radius: 5px; padding: 4px 2px; font-size: 10px; font-weight: 600; line-height: 1.3; }
  .seat-badge.desk { background: rgba(106,180,247,0.12); color: var(--desk-color); border: 1px solid rgba(106,180,247,0.25); }
  .seat-badge.easel { background: rgba(247,162,106,0.12); color: var(--easel-color); border: 1px solid rgba(247,162,106,0.25); }
  .seat-badge.full-type { opacity: 0.4; }
  .seat-count { font-size: 14px; font-weight: 800; display: block; }
  .seat-label-text { font-size: 9px; font-weight: 400; opacity: 0.8; }

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    z-index: 200; align-items: center; justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 32px; width: 90%; max-width: 440px; position: relative;
  }
  .modal h3 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .modal-subtitle { font-size: 13px; color: var(--text2); margin-bottom: 20px; }

  .deadline-notice {
    background: rgba(247,217,106,0.1); border: 1px solid rgba(247,217,106,0.3);
    border-radius: 8px; padding: 10px 14px; margin-bottom: 16px;
    font-size: 12px; color: var(--warning);
  }

  .seat-select { display: flex; gap: 12px; margin-bottom: 20px; }
  .seat-select-card {
    flex: 1; border-radius: 12px; border: 2px solid var(--border);
    padding: 16px 10px; text-align: center; cursor: pointer; transition: all 0.2s; background: var(--surface2);
  }
  .seat-select-card:hover:not(.disabled) { transform: translateY(-2px); }
  .seat-select-card.selected-desk { border-color: var(--desk-color); background: rgba(106,180,247,0.08); }
  .seat-select-card.selected-easel { border-color: var(--easel-color); background: rgba(247,162,106,0.08); }
  .seat-select-card.disabled { opacity: 0.35; cursor: not-allowed; }
  .seat-select-card .seat-icon { font-size: 28px; margin-bottom: 6px; }
  .seat-select-card .seat-name { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
  .seat-select-card .seat-remain { font-size: 12px; color: var(--text2); }
  .seat-select-card.selected-desk .seat-name { color: var(--desk-color); }
  .seat-select-card.selected-easel .seat-name { color: var(--easel-color); }

  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 6px; }
  .form-group input {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; color: var(--text);
    font-family: 'Noto Sans KR', sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s;
  }
  .form-group input:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn {
    flex: 1; padding: 12px; border-radius: 10px; border: none; cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif; font-size: 14px; font-weight: 500; transition: all 0.2s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #6a58e0; }
  .btn-secondary { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }
  .btn-secondary:hover { color: var(--text); }
  .modal-close { position: absolute; top: 16px; right: 16px; background: none; border: none; color: var(--text2); font-size: 20px; cursor: pointer; }

  /* 취소 모달 */
  .cancel-info { background: var(--surface2); border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; font-size: 13px; }
  .cancel-info p { color: var(--text2); margin-bottom: 4px; }
  .cancel-info strong { color: var(--text); }

  .admin-section { margin-bottom: 32px; }
  .admin-section h3 {
    font-size: 16px; font-weight: 600; margin-bottom: 16px;
    padding-bottom: 10px; border-bottom: 1px solid var(--border); color: var(--accent2);
  }
  .bookings-list { display: flex; flex-direction: column; gap: 10px; }
  .booking-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .booking-info { flex: 1; }
  .booking-name { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .booking-detail { font-size: 12px; color: var(--text2); margin-top: 3px; }
  .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .status-pending { background: rgba(247,217,106,0.15); color: var(--warning); }
  .status-approved { background: rgba(106,247,162,0.15); color: var(--success); }
  .status-cancelled { background: rgba(247,106,106,0.15); color: var(--danger); }
  .booking-actions { display: flex; gap: 6px; }
  .small-btn {
    padding: 5px 12px; border-radius: 6px; border: none; cursor: pointer;
    font-size: 12px; font-family: 'Noto Sans KR', sans-serif; font-weight: 500; transition: all 0.2s;
  }
  .small-btn-approve { background: rgba(106,247,162,0.15); color: var(--success); }
  .small-btn-approve:hover { background: rgba(106,247,162,0.3); }
  .small-btn-cancel { background: rgba(247,106,106,0.15); color: var(--danger); }
  .small-btn-cancel:hover { background: rgba(247,106,106,0.3); }
  .type-badge-desk { background: rgba(106,180,247,0.15); color: var(--desk-color); padding: 2px 8px; border-radius: 10px; font-size: 11px; }
  .type-badge-easel { background: rgba(247,162,106,0.15); color: var(--easel-color); padding: 2px 8px; border-radius: 10px; font-size: 11px; }

  .admin-login {
    max-width: 360px; margin: 60px auto; background: var(--surface);
    border: 1px solid var(--border); border-radius: 16px; padding: 36px; text-align: center;
  }
  .admin-login h3 { font-size: 20px; margin-bottom: 6px; }
  .admin-login p { font-size: 13px; color: var(--text2); margin-bottom: 28px; }

  .toggle-closed-grid { display: grid; grid-template-columns: 80px repeat(7, 1fr); gap: 5px; margin-bottom: 12px; }
  .toggle-cell {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 4px; text-align: center; font-size: 11px; cursor: pointer; transition: all 0.2s; color: var(--text2);
  }
  .toggle-cell.is-closed { background: rgba(247,106,106,0.12); border-color: var(--danger); color: var(--danger); }
  .toggle-cell:hover:not(.header-cell) { border-color: var(--accent2); }
  .toggle-cell.header-cell { cursor: default; background: transparent; border: none; font-size: 11px; }

  .empty-state { text-align: center; padding: 40px; color: var(--text2); font-size: 14px; }
  .filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-btn {
    padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
    background: transparent; color: var(--text2); cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif; font-size: 12px; transition: all 0.2s;
  }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .loading-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    z-index: 300; align-items: center; justify-content: center; flex-direction: column; gap: 16px;
  }
  .loading-overlay.show { display: flex; }
  .spinner {
    width: 40px; height: 40px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 24px; font-size: 14px; z-index: 400; transition: transform 0.3s ease; white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--success); color: var(--success); }
  .toast.error { border-color: var(--danger); color: var(--danger); }

  @media (max-width: 600px) {
    .schedule-grid, .toggle-closed-grid { grid-template-columns: 56px repeat(7, 1fr); gap: 3px; }
    .seat-count { font-size: 12px; }
    .seat-label-text { display: none; }
    main { padding: 16px 8px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Class<span>Book</span></div>
  <div class="tab-btns">
    <button class="tab-btn active" onclick="showTab('student')">📚 수업 신청</button>
    <button class="tab-btn" onclick="showTab('admin')">⚙️ 관리자</button>
  </div>
</header>

<main id="student-view">
  <div class="week-nav">
    <button class="nav-btn" onclick="changeWeek(-1)">&#8592;</button>
    <h2 id="week-title"></h2>
    <button class="nav-btn" onclick="changeWeek(1)">&#8594;</button>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--desk-color)"></div> 🪑 책상 (최대 4명)</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--easel-color)"></div> 🖼️ 이젤 (최대 5명)</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--border)"></div> 휴강</div>
    <div class="legend-item" style="font-size:11px; color:var(--text2)">※ 당일 신청/취소 불가 (하루 전까지)</div>
  </div>
  <div class="schedule-grid" id="schedule-grid"></div>
</main>

<main id="admin-view" style="display:none">
  <div id="admin-login-view" class="admin-login">
    <h3>🔒 관리자 로그인</h3>
    <p>관리자 비밀번호를 입력하세요</p>
    <div class="form-group">
      <input type="password" id="admin-pw" placeholder="비밀번호" onkeydown="if(event.key==='Enter')adminLogin()">
    </div>
    <button class="btn btn-primary" style="width:100%" onclick="adminLogin()">로그인</button>
  </div>
  <div id="admin-panel" style="display:none">
    <div class="admin-section">
      <h3>📅 휴강 설정 (클릭하면 휴강/정상 전환)</h3>
      <div class="week-nav" style="margin-bottom:16px">
        <button class="nav-btn" onclick="changeWeek(-1)">&#8592;</button>
        <h2 id="admin-week-title"></h2>
        <button class="nav-btn" onclick="changeWeek(1)">&#8594;</button>
      </div>
      <div class="toggle-closed-grid" id="toggle-grid"></div>
    </div>
    <div class="admin-section">
      <h3>📋 신청자 명단</h3>
      <div class="filter-bar">
        <button class="filter-btn active" onclick="setFilter('all',this)">전체</button>
        <button class="filter-btn" onclick="setFilter('pending',this)">대기중</button>
        <button class="filter-btn" onclick="setFilter('approved',this)">승인됨</button>
        <button class="filter-btn" onclick="setFilter('cancelled',this)">취소됨</button>
        <button class="filter-btn" onclick="setFilter('desk',this)">🪑 책상</button>
        <button class="filter-btn" onclick="setFilter('easel',this)">🖼️ 이젤</button>
      </div>
      <div class="bookings-list" id="bookings-list"></div>
    </div>
  </div>
</main>

<!-- 신청 모달 -->
<div class="modal-overlay" id="booking-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('booking-modal')">✕</button>
    <h3 id="modal-title">수업 신청</h3>
    <div class="modal-subtitle" id="modal-subtitle"></div>
    <div class="deadline-notice">⚠️ 신청은 수업 하루 전까지만 가능합니다</div>
    <div class="seat-select">
      <div class="seat-select-card" id="card-desk" onclick="selectSeatType('desk')">
        <div class="seat-icon">🪑</div>
        <div class="seat-name">책상 자리</div>
        <div class="seat-remain" id="desk-remain"></div>
      </div>
      <div class="seat-select-card" id="card-easel" onclick="selectSeatType('easel')">
        <div class="seat-icon">🖼️</div>
        <div class="seat-name">이젤 자리</div>
        <div class="seat-remain" id="easel-remain"></div>
      </div>
    </div>
    <div class="form-group">
      <label>이름</label>
      <input type="text" id="input-name" placeholder="홍길동">
    </div>
    <div class="form-group">
      <label>전화번호</label>
      <input type="tel" id="input-phone" placeholder="010-0000-0000" oninput="formatPhone(this)">
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('booking-modal')">취소</button>
      <button class="btn btn-primary" onclick="submitBooking()">신청하기</button>
    </div>
  </div>
</div>

<!-- 취소 모달 -->
<div class="modal-overlay" id="cancel-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('cancel-modal')">✕</button>
    <h3>신청 취소</h3>
    <div class="modal-subtitle">본인 확인 후 취소됩니다</div>
    <div class="deadline-notice">⚠️ 취소는 수업 하루 전까지만 가능합니다</div>
    <div class="form-group">
      <label>전화번호로 신청 내역 확인</label>
      <input type="tel" id="cancel-phone" placeholder="010-0000-0000" oninput="formatPhone(this)">
    </div>
    <div id="cancel-results"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('cancel-modal')">닫기</button>
      <button class="btn btn-primary" onclick="searchBooking()">조회하기</button>
    </div>
  </div>
</div>

<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <div style="color:var(--text2); font-size:14px">처리 중...</div>
</div>
<div class="toast" id="toast"></div>

<script>
// ── Firebase 설정 ──
const firebaseConfig = {
  apiKey: "AIzaSyAMdD61YAQxZmd29ibIaBqlEZhzKNK6yhE",
  authDomain: "my-academy-d7ca6.firebaseapp.com",
  databaseURL: "https://my-academy-d7ca6-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "my-academy-d7ca6",
  storageBucket: "my-academy-d7ca6.firebasestorage.app",
  messagingSenderId: "273218566717",
  appId: "1:273218566717:web:076f7be16e214a65e20854"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ── EmailJS 설정 ──
emailjs.init("EAMnebZf2zSSMZ1R6");
const EMAILJS_SERVICE_ID = "service_5w7zhom";
const EMAILJS_TEMPLATE_ID = "emj95ds";

// ── 상수 ──
const MAX_DESK = 4;
const MAX_EASEL = 5;
const ADMIN_PASSWORD = '1234';
const DAYS = ['월','화','수','목','금','토','일'];
const PERIODS = [
  { label: '1교시', time: '10:00~13:00' },
  { label: '2교시', time: '14:00~17:00' },
  { label: '3교시', time: '18:00~22:00' },
];

// ── 상태 ──
let currentWeekOffset = 0;
let selectedCell = null;
let selectedSeatType = null;
let adminLoggedIn = false;
let currentFilter = 'all';
let allBookings = {};
let allClosed = {};

// ── Firebase 실시간 연동 ──
db.ref('bookings').on('value', snap => {
  allBookings = snap.val() || {};
  renderSchedule();
  if (adminLoggedIn) renderBookingsList();
});
db.ref('closed').on('value', snap => {
  allClosed = snap.val() || {};
  renderSchedule();
  if (adminLoggedIn) renderToggleGrid(getWeekDates(currentWeekOffset));
});

// ── 유틸 ──
function getWeekDates(offset) {
  const now = new Date();
  const day = now.getDay();
  const monday = new Date(now);
  monday.setDate(now.getDate() - (day===0?6:day-1) + offset*7);
  return Array.from({length:7}, (_,i) => { const d=new Date(monday); d.setDate(monday.getDate()+i); return d; });
}
function dateKey(d) { return d.toISOString().slice(0,10); }
function cellKey(d, pi) { return `${dateKey(d)}_${pi}`; }
function formatDate(d) { return `${d.getMonth()+1}/${d.getDate()}`; }
function isToday(d) { return d.toDateString()===new Date().toDateString(); }
function dayIdx(d) { return d.getDay()===0?6:d.getDay()-1; }

// 하루 전까지만 신청/취소 가능 체크
function isDeadlinePassed(date) {
  const today = new Date();
  today.setHours(0,0,0,0);
  const target = new Date(date);
  target.setHours(0,0,0,0);
  return target <= today; // 당일 포함 이전이면 마감
}

function countByType(key, type) {
  const list = allBookings[key];
  if (!list) return 0;
  return Object.values(list).filter(b => b.seatType===type && b.status!=='cancelled').length;
}

// ── 탭 ──
function showTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active', (i===0&&tab==='student')||(i===1&&tab==='admin'));
  });
  document.getElementById('student-view').style.display = tab==='student'?'':'none';
  document.getElementById('admin-view').style.display = tab==='admin'?'':'none';
  if (tab==='admin') renderAdmin();
}

function changeWeek(dir) {
  currentWeekOffset += dir;
  renderSchedule();
  if (adminLoggedIn) renderAdmin();
}

// ── 스케줄 렌더 ──
function renderSchedule() {
  const dates = getWeekDates(currentWeekOffset);
  document.getElementById('week-title').textContent = `${formatDate(dates[0])} ~ ${formatDate(dates[6])}주`;
  const grid = document.getElementById('schedule-grid');
  grid.innerHTML = '';

  grid.appendChild(el('div','grid-header',''));
  dates.forEach(d => {
    const h = el('div','grid-header'+(isToday(d)?' today':''), `${DAYS[dayIdx(d)]}\n${formatDate(d)}`);
    h.style.whiteSpace='pre'; grid.appendChild(h);
  });

  PERIODS.forEach((p,pi) => {
    const tl = el('div','time-label',`${p.label}\n${p.time}`);
    tl.style.whiteSpace='pre'; grid.appendChild(tl);
    dates.forEach(d => {
      const key = cellKey(d,pi);
      const closed = allClosed[key];
      const deskLeft = MAX_DESK - countByType(key,'desk');
      const easelLeft = MAX_EASEL - countByType(key,'easel');
      const anyLeft = deskLeft>0 || easelLeft>0;
      const deadlinePassed = isDeadlinePassed(d);

      const cell = document.createElement('div');
      cell.className = 'class-cell'+(closed?' closed':'');

      if (closed) {
        cell.innerHTML = `<div class="cell-closed-label">휴강</div>`;
      } else {
        cell.innerHTML = `
          <div class="seat-row">
            <div class="seat-badge desk${deskLeft<=0?' full-type':''}">
              <span class="seat-count">${deskLeft<=0?'✕':deskLeft}</span>
              <span class="seat-label-text">책상</span>
            </div>
            <div class="seat-badge easel${easelLeft<=0?' full-type':''}">
              <span class="seat-count">${easelLeft<=0?'✕':easelLeft}</span>
              <span class="seat-label-text">이젤</span>
            </div>
          </div>
          ${deadlinePassed ? '<div style="font-size:9px;color:var(--text2);margin-top:3px">신청마감</div>' : ''}
        `;
        if (anyLeft && !deadlinePassed) {
          cell.onclick = () => openModal(d, pi, key, deskLeft, easelLeft);
        } else if (deadlinePassed && anyLeft) {
          cell.style.cursor = 'not-allowed';
          cell.title = '당일 신청 불가';
          cell.style.opacity = '0.6';
        } else {
          cell.style.cursor = 'not-allowed';
        }
      }
      grid.appendChild(cell);
    });
  });
}

function el(tag,cls,text) { const e=document.createElement(tag); e.className=cls; e.textContent=text; return e; }

// ── 신청 모달 ──
function openModal(date, pi, key, deskLeft, easelLeft) {
  selectedCell = {date, pi, key, deskLeft, easelLeft};
  selectedSeatType = null;
  const p = PERIODS[pi];
  document.getElementById('modal-title').textContent = `${p.label} 신청`;
  document.getElementById('modal-subtitle').textContent =
    `${date.getFullYear()}년 ${date.getMonth()+1}월 ${date.getDate()}일 (${DAYS[dayIdx(date)]}) · ${p.time}`;
  document.getElementById('card-desk').className = 'seat-select-card'+(deskLeft<=0?' disabled':'');
  document.getElementById('card-easel').className = 'seat-select-card'+(easelLeft<=0?' disabled':'');
  document.getElementById('desk-remain').textContent = deskLeft<=0?'마감':`${deskLeft}자리 남음`;
  document.getElementById('easel-remain').textContent = easelLeft<=0?'마감':`${easelLeft}자리 남음`;
  document.getElementById('input-name').value = '';
  document.getElementById('input-phone').value = '';
  document.getElementById('booking-modal').classList.add('show');
}

function selectSeatType(type) {
  if (type==='desk'&&selectedCell.deskLeft<=0) return;
  if (type==='easel'&&selectedCell.easelLeft<=0) return;
  selectedSeatType = type;
  document.getElementById('card-desk').className =
    'seat-select-card'+(selectedCell.deskLeft<=0?' disabled':'')+(type==='desk'?' selected-desk':'');
  document.getElementById('card-easel').className =
    'seat-select-card'+(selectedCell.easelLeft<=0?' disabled':'')+(type==='easel'?' selected-easel':'');
  setTimeout(()=>document.getElementById('input-name').focus(), 50);
}

function closeModal(id) {
  document.getElementById(id).classList.remove('show');
  if (id==='booking-modal') { selectedCell=null; selectedSeatType=null; }
}

function formatPhone(input) {
  let v=input.value.replace(/\D/g,'');
  if(v.length>11) v=v.slice(0,11);
  if(v.length>7) v=v.slice(0,3)+'-'+v.slice(3,7)+'-'+v.slice(7);
  else if(v.length>3) v=v.slice(0,3)+'-'+v.slice(3);
  input.value=v;
}

async function submitBooking() {
  if (!selectedSeatType) { showToast('자리 종류를 선택해주세요','error'); return; }
  const name = document.getElementById('input-name').value.trim();
  const phone = document.getElementById('input-phone').value.trim();
  if (!name) { showToast('이름을 입력해주세요','error'); return; }
  if (!phone||phone.length<9) { showToast('전화번호를 입력해주세요','error'); return; }

  const key = selectedCell.key;
  const existing = allBookings[key] ? Object.values(allBookings[key]) : [];
  if (existing.find(b=>b.phone===phone&&b.status!=='cancelled')) {
    showToast('이미 신청된 전화번호입니다','error'); return;
  }
  const used = countByType(key, selectedSeatType);
  const max = selectedSeatType==='desk'?MAX_DESK:MAX_EASEL;
  if (used>=max) { showToast('해당 자리가 마감됐습니다','error'); return; }

  showLoading(true);
  try {
    const newRef = db.ref(`bookings/${key}`).push();
    await newRef.set({
      name, phone, seatType: selectedSeatType,
      status: 'pending', time: new Date().toISOString()
    });

    // 이메일 알림 발송
    const p = PERIODS[selectedCell.pi];
    const d = selectedCell.date;
    const typeLabel = selectedSeatType==='desk'?'🪑 책상':'🖼️ 이젤';
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      subject: `새 수업 신청 - ${name}님`,
      message: `새로운 수업 신청이 들어왔습니다!\n\n` +
        `👤 이름: ${name}\n📱 전화번호: ${phone}\n` +
        `📅 날짜: ${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${DAYS[dayIdx(d)]})\n` +
        `⏰ 수업: ${p.label} (${p.time})\n🪑 자리: ${typeLabel}\n\n` +
        `관리자 페이지에서 승인해주세요.`
    });

    closeModal('booking-modal');
    showToast(`${name}님 ${typeLabel} 자리 신청 완료! ✅`, 'success');
  } catch(e) {
    showToast('신청 중 오류가 발생했습니다', 'error');
  }
  showLoading(false);
}

// ── 취소 모달 ──
function openCancelModal(d, pi, key) {
  selectedCell = {date:d, pi, key};
  document.getElementById('cancel-phone').value = '';
  document.getElementById('cancel-results').innerHTML = '';
  document.getElementById('cancel-modal').classList.add('show');
}

function searchBooking() {
  const phone = document.getElementById('cancel-phone').value.trim();
  if (!phone||phone.length<9) { showToast('전화번호를 입력해주세요','error'); return; }

  const key = selectedCell.key;
  const list = allBookings[key] ? Object.entries(allBookings[key]) : [];
  const found = list.filter(([,b])=>b.phone===phone&&b.status!=='cancelled');

  const resultsDiv = document.getElementById('cancel-results');
  if (found.length===0) {
    resultsDiv.innerHTML = '<div style="color:var(--text2);font-size:13px;padding:12px 0">해당 전화번호로 신청된 내역이 없습니다</div>';
    return;
  }

  const p = PERIODS[selectedCell.pi];
  const d = selectedCell.date;
  resultsDiv.innerHTML = found.map(([id,b])=>`
    <div class="cancel-info">
      <p>이름: <strong>${b.name}</strong></p>
      <p>자리: <strong>${b.seatType==='desk'?'🪑 책상':'🖼️ 이젤'}</strong></p>
      <p>수업: <strong>${d.getMonth()+1}/${d.getDate()} ${p.label}</strong></p>
      <button class="btn btn-secondary" style="margin-top:10px;width:100%;background:rgba(247,106,106,0.15);color:var(--danger);border-color:var(--danger)"
        onclick="confirmCancel('${key}','${id}','${b.name}','${b.seatType}')">이 신청 취소하기</button>
    </div>
  `).join('');
}

async function confirmCancel(key, id, name, seatType) {
  showLoading(true);
  try {
    await db.ref(`bookings/${key}/${id}`).update({ status: 'cancelled' });

    // 이메일 알림
    const [dateStr, pi] = key.split('_');
    const p = PERIODS[parseInt(pi)];
    const d = new Date(dateStr);
    const typeLabel = seatType==='desk'?'🪑 책상':'🖼️ 이젤';
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      subject: `수업 취소 - ${name}님`,
      message: `수업 신청이 취소되었습니다.\n\n` +
        `👤 이름: ${name}\n🪑 자리: ${typeLabel}\n` +
        `📅 날짜: ${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일\n` +
        `⏰ 수업: ${p.label} (${p.time})`
    });

    closeModal('cancel-modal');
    showToast(`${name}님 신청이 취소되었습니다`, 'success');
  } catch(e) {
    showToast('취소 중 오류가 발생했습니다','error');
  }
  showLoading(false);
}

// ── 관리자 ──
function adminLogin() {
  if (document.getElementById('admin-pw').value===ADMIN_PASSWORD) {
    adminLoggedIn=true;
    document.getElementById('admin-login-view').style.display='none';
    document.getElementById('admin-panel').style.display='';
    renderAdmin();
  } else showToast('비밀번호가 틀렸습니다','error');
}

function renderAdmin() {
  if (!adminLoggedIn) return;
  const dates = getWeekDates(currentWeekOffset);
  document.getElementById('admin-week-title').textContent = `${formatDate(dates[0])} ~ ${formatDate(dates[6])}주`;
  renderToggleGrid(dates);
  renderBookingsList();
}

function renderToggleGrid(dates) {
  const grid = document.getElementById('toggle-grid');
  grid.innerHTML='';
  grid.appendChild(el('div','toggle-cell header-cell',''));
  dates.forEach(d=>grid.appendChild(el('div','toggle-cell header-cell',`${DAYS[dayIdx(d)]} ${formatDate(d)}`)));
  PERIODS.forEach((p,pi)=>{
    grid.appendChild(el('div','toggle-cell header-cell',p.label));
    dates.forEach(d=>{
      const key=cellKey(d,pi); const closed=allClosed[key];
      const cell=el('div','toggle-cell'+(closed?' is-closed':''),closed?'🔴 휴강':'🟢 정상');
      cell.onclick=()=>toggleClosed(key);
      grid.appendChild(cell);
    });
  });
}

async function toggleClosed(key) {
  if (allClosed[key]) await db.ref(`closed/${key}`).remove();
  else await db.ref(`closed/${key}`).set(true);
}

function setFilter(f,btn) {
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderBookingsList();
}

function renderBookingsList() {
  const list = document.getElementById('bookings-list');
  list.innerHTML='';
  let all=[];
  Object.entries(allBookings).forEach(([key,bMap])=>{
    const [dateStr,pi]=key.split('_');
    Object.entries(bMap).forEach(([id,b])=>all.push({key,id,dateStr,pi:parseInt(pi),...b}));
  });
  all.sort((a,b)=>new Date(b.time)-new Date(a.time));
  if(currentFilter==='pending') all=all.filter(b=>b.status==='pending');
  else if(currentFilter==='approved') all=all.filter(b=>b.status==='approved');
  else if(currentFilter==='cancelled') all=all.filter(b=>b.status==='cancelled');
  else if(currentFilter==='desk') all=all.filter(b=>b.seatType==='desk');
  else if(currentFilter==='easel') all=all.filter(b=>b.seatType==='easel');

  if(all.length===0){list.innerHTML='<div class="empty-state">해당 내역이 없습니다</div>';return;}
  all.forEach(b=>{
    const p=PERIODS[b.pi]; const d=new Date(b.dateStr);
    const statusLabel={pending:'대기중',approved:'승인됨',cancelled:'취소됨'}[b.status];
    const statusCls={pending:'status-pending',approved:'status-approved',cancelled:'status-cancelled'}[b.status];
    const typeBadge=b.seatType==='desk'
      ?'<span class="type-badge-desk">🪑 책상</span>'
      :'<span class="type-badge-easel">🖼️ 이젤</span>';
    const card=document.createElement('div');
    card.className='booking-card';
    card.innerHTML=`
      <div class="booking-info">
        <div class="booking-name">${b.name} ${typeBadge}</div>
        <div class="booking-detail">${b.phone} · ${d.getMonth()+1}/${d.getDate()} (${DAYS[dayIdx(d)]}) ${p.label} ${p.time}</div>
      </div>
      <span class="status-badge ${statusCls}">${statusLabel}</span>
      <div class="booking-actions">
        ${b.status==='pending'?`<button class="small-btn small-btn-approve" onclick="updateStatus('${b.key}','${b.id}','approved','${b.name}')">승인</button>`:''}
        ${b.status!=='cancelled'?`<button class="small-btn small-btn-cancel" onclick="updateStatus('${b.key}','${b.id}','cancelled','${b.name}')">취소</button>`:''}
      </div>`;
    list.appendChild(card);
  });
}

async function updateStatus(key, id, status, name) {
  showLoading(true);
  try {
    await db.ref(`bookings/${key}/${id}`).update({status});
    showToast(status==='approved'?`${name}님 승인되었습니다 ✅`:`${name}님 취소되었습니다`,
      status==='approved'?'success':'error');
  } catch(e) { showToast('오류가 발생했습니다','error'); }
  showLoading(false);
}

function showLoading(show) {
  document.getElementById('loading').classList.toggle('show', show);
}

function showToast(msg, type='success') {
  const t=document.getElementById('toast');
  t.textContent=msg; t.className=`toast ${type} show`;
  setTimeout(()=>t.classList.remove('show'),3000);
}

renderSchedule();
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') {
    closeModal('booking-modal');
    closeModal('cancel-modal');
  }
});
</script>
</body>
</html>
